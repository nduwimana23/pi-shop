<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pi Marketplace</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
  Pi.init({ version: "2.0", sandbox: true });
</script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  padding-bottom: 90px;
}
header {
  background: #0a8f3c;
  color: white;
  padding: 15px;
  text-align: center;
}
button { cursor: pointer; }

.top-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
}
.top-actions button, select {
  padding: 6px 10px;
  border-radius: 6px;
  border: none;
}

.search-box {
  padding: 12px;
}
.search-box input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.categories {
  display: flex;
  gap: 10px;
  padding: 10px;
  overflow-x: auto;
}
.category {
  background: #ddd;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13px;
}

.products {
  padding: 15px;
}
.product {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}
.price {
  color: #0a8f3c;
  font-weight: bold;
}
.buy-btn {
  background: #0a8f3c;
  color: white;
  border: none;
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  margin-top: 8px;
}

.section {
  display: none;
  padding: 15px;
}

.ai-chat {
  position: fixed;
  right: 15px;
  bottom: 100px;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  background: #0a8f3c;
  color: white;
  border: none;
  font-size: 22px;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: white;
  border-top: 1px solid #ccc;
  display: flex;
  justify-content: space-around;
  padding: 8px 0;
}
.bottom-nav button {
  background: none;
  border: none;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <h2>🛒 Pi Marketplace</h2>
  <p>All payments in Pi (GCV)</p>

  <div class="top-actions">
    <button onclick="login()">🔐 Login</button>
    <button onclick="openWallet()">👛 Wallet</button>

    <select onchange="changeLang(this.value)">
      <option value="en">English</option>
      <option value="rn">Ikirundi</option>
      <option value="pt">Portuguese</option>
    </select>
  </div>
</header>

<div class="search-box">
  <input type="text" id="search" placeholder="Search product..." onkeyup="searchProduct()">
</div>

<div class="categories">
  <div class="category">Foods</div>
  <div class="category">Drinks</div>
  <div class="category">Electronics</div>
</div>

<!-- SHOP -->
<div id="shop" class="products section" style="display:block">

  <div class="product" data-name="rice">
    <h3>Umuceri</h3>
    <p class="price">2 Pi</p>
    <button class="buy-btn" onclick="buy()">Gura na Pi</button>
  </div>

  <div class="product" data-name="fanta">
    <h3>Fanta</h3>
    <p class="price">1 Pi</p>
    <button class="buy-btn" onclick="buy()">Buy with Pi</button>
  </div>

  <div class="product" data-name="radio">
    <h3>Radio</h3>
    <p class="price">5 Pi</p>
    <button class="buy-btn" onclick="buy()">Comprar com Pi</button>
  </div>

</div>

<!-- LEARN -->
<div id="learn" class="section">
  <h3>📘 Learn</h3>
  <p>Learn how Pi payments and marketplace work.</p>
</div>

<!-- CHAT -->
<div id="chat" class="section">
  <h3>💬 AI Support</h3>
  <p>Ask questions about products and Pi usage.</p>
</div>

<button class="ai-chat" onclick="showSection('chat')">💬</button>

<div class="bottom-nav">
  <button onclick="showSection('shop')">Shop</button>
  <button onclick="showSection('learn')">Learn</button>
  <button onclick="showSection('chat')">Chat</button>
</div>

<script>
function login() {
  Pi.authenticate(['username'], auth => {
    alert("Welcome " + auth.user.username);
  }, err => alert("Login failed"));
}

function openWallet() {
  alert("Pi Wallet will open in production");
}

function buy() {
  alert("Payment test (sandbox)");
}

function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
  document.getElementById(id).style.display = 'block';
}

function searchProduct() {
  let value = document.getElementById("search").value.toLowerCase();
  document.querySelectorAll(".product").forEach(p => {
    p.style.display = p.dataset.name.includes(value) ? "block" : "none";
  });
}

function changeLang(lang) {
  alert("Language switched to " + lang);
}
</script>

</body>
</html>
