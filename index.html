<!DOCTYPE html>
<html lang="rn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pi Shop Marketplace</title>

<!-- PI SDK -->
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
  Pi.init({ version: "2.0", sandbox: true });
</script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

header {
  background: #0a7a4a;
  color: white;
  padding: 20px;
  text-align: center;
}

nav {
  display: flex;
  justify-content: space-around;
  background: white;
  padding: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,.1);
}

nav button {
  border: none;
  background: none;
  font-size: 16px;
  cursor: pointer;
}

.container {
  padding: 15px;
}

.search-box input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.categories {
  margin: 15px 0;
}

.categories button {
  margin: 5px;
  padding: 8px 12px;
  border-radius: 20px;
  border: 1px solid #0a7a4a;
  background: white;
  color: #0a7a4a;
  cursor: pointer;
}

.categories button.active {
  background: #0a7a4a;
  color: white;
}

.product {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.product h3 {
  margin: 0;
}

.buy-btn {
  margin-top: 10px;
  padding: 10px;
  width: 100%;
  background: #0a7a4a;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.login-btn {
  width: 100%;
  padding: 12px;
  background: #333;
  color: white;
  border-radius: 8px;
  border: none;
  margin-bottom: 15px;
}
</style>
</head>

<body>

<header>
  <h1>Pi Shop Marketplace</h1>
  <p>All payments in Pi (GCV Based)</p>
</header>

<nav>
  <button>Products</button>
  <button>Vendors</button>
  <button>My Cart (<span id="cartCount">0</span>)</button>
</nav>

<div class="container">

<button class="login-btn" onclick="loginPi()">Injira muri Pi</button>

<div class="search-box">
  <input type="text" placeholder="Rondera igicuruzwa..." onkeyup="searchProduct(this.value)">
</div>

<div class="categories">
  <button class="active" onclick="filterCategory('all')">All</button>
  <button onclick="filterCategory('food')">Foods</button>
  <button onclick="filterCategory('drink')">Drinks</button>
  <button onclick="filterCategory('electronic')">Electronics</button>
</div>

<div id="products"></div>

</div>

<script>
let cart = 0;
let currentCategory = "all";

const products = [
  { name: "Isukari (1kg)", desc: "Isukari yiza yo mu rugo", price: 0.003, category: "food" },
  { name: "Umuceri (1kg)", desc: "Umuceri wiza wo kurya neza", price: 0.005, category: "food" },
  { name: "Isabuni", desc: "Isabuni yo mu rugo", price: 0.002, category: "food" }
];

function renderProducts(list){
  const div = document.getElementById("products");
  div.innerHTML = "";
  list.forEach(p => {
    div.innerHTML += `
      <div class="product">
        <h3>${p.name}</h3>
        <p>${p.desc}</p>
        <b>Igiciro: ${p.price} Pi</b>
        <button class="buy-btn" onclick="buy()">Gura</button>
      </div>
    `;
  });
}

function filterCategory(cat){
  currentCategory = cat;
  document.querySelectorAll(".categories button").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");
  applyFilter();
}

function searchProduct(text){
  applyFilter(text);
}

function applyFilter(search=""){
  let list = products.filter(p =>
    (currentCategory === "all" || p.category === currentCategory) &&
    p.name.toLowerCase().includes(search.toLowerCase())
  );
  renderProducts(list);
}

function buy(){
  cart++;
  document.getElementById("cartCount").innerText = cart;
  alert("Vyashizwe muri cart (test)");
}

function loginPi(){
  Pi.authenticate(['username'], function(auth){
    alert("Murakaza neza " + auth.user.username);
  }, function(){
    alert("Habaye ikibazo");
  });
}

renderProducts(products);
</script>

</body>
</html>
