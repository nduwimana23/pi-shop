<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pi Shop</title>

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    Pi.init({ version: "2.0", sandbox: true });
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }
    button {
      padding: 10px;
      margin: 5px;
      cursor: pointer;
    }
    .box {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <!-- Language buttons -->
  <button onclick="setLang('rn')">Kirundi</button>
  <button onclick="setLang('pt')">Português</button>

  <div class="box">
    <h1 id="title"></h1>
    <p id="products"></p>

    <button onclick="login()" id="loginBtn"></button>
    <button onclick="buy()" id="buyBtn"></button>
  </div>

  <script>
    /* 🌍 MULTI-LANGUAGE TEXTS */
    const texts = {
      rn: {
        title: "Murakaza neza kuri Pi Shop",
        products: "Ibicuruzwa: Isabuni – Igiciro: 2 Pi",
        login: "Injira muri Pi",
        buy: "Gura",
        welcome: "Murakaza neza "
      },
      pt: {
        title: "Bem-vindo à Loja Pi",
        products: "Produtos: Sabão – Preço: 2 Pi",
        login: "Entrar com Pi",
        buy: "Comprar",
        welcome: "Bem-vindo "
      }
    };

    let currentLang = "rn";

    function setLang(lang) {
      currentLang = lang;
      document.getElementById("title").innerText = texts[lang].title;
      document.getElementById("products").innerText = texts[lang].products;
      document.getElementById("loginBtn").innerText = texts[lang].login;
      document.getElementById("buyBtn").innerText = texts[lang].buy;
    }

    /* Default language */
    setLang("rn");

    /* 🔐 PI LOGIN */
    function login() {
      Pi.authenticate(
        ["username"],
        function (auth) {
          alert(texts[currentLang].welcome + auth.user.username);
        },
        function (error) {
          alert("Habaye ikibazo / Erro");
        }
      );
    }

    /* 💰 PI PAYMENT (DEMO) */
    function buy() {
      Pi.createPayment(
        {
          amount: 2,
          memo: "Isabuni / Sabão",
          metadata: { product: "Isabuni" }
        },
        {
          onReadyForServerApproval: function (paymentId) {
            console.log("Payment ID:", paymentId);
          },
          onReadyForServerCompletion: function (paymentId, txid) {
            alert("Payment successful!");
          },
          onCancel: function () {
            alert("Payment cancelled");
          },
          onError: function (error) {
            alert("Payment error");
          }
        }
      );
    }
  </script>

</body>
</html>
