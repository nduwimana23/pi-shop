<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pi Shop Marketplace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    Pi.init({ version: "2.0", sandbox: true });
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #0a7d4f;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      padding: 15px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .cart {
      background: #0a7d4f;
      color: white;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 14px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .product {
      background: white;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .product h3 {
      margin-top: 0;
    }

    .price {
      font-weight: bold;
      margin: 10px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      background: #0a7d4f;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button.secondary {
      background: #444;
      margin-bottom: 10px;
    }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h2>Pi Shop Marketplace</h2>
  <p>All payments in Pi (GCV Based)</p>
</header>

<div class="container">

  <div class="top-bar">
    <button class="secondary" onclick="login()">Injira muri Pi</button>
    <div class="cart">🛒 Cart: <span id="cartCount">0</span></div>
  </div>

  <div class="products">

    <div class="product">
      <h3>Isukari (1kg)</h3>
      <p>Isukari yiza yo mu rugo</p>
      <div class="price">Igiciro: 0.003 Pi</div>
      <button onclick="buy('Isukari', 0.003)">Gura</button>
    </div>

    <div class="product">
      <h3>Umuceri (1kg)</h3>
      <p>Umuceri wiza wo kurya neza</p>
      <div class="price">Igiciro: 0.005 Pi</div>
      <button onclick="buy('Umuceri', 0.005)">Gura</button>
    </div>

    <div class="product">
      <h3>Isabuni</h3>
      <p>Isabuni yo mu rugo</p>
      <div class="price">Igiciro: 0.002 Pi</div>
      <button onclick="buy('Isabuni', 0.002)">Gura</button>
    </div>

  </div>
</div>

<footer>
  © 2026 Pi Shop • Sandbox Mode
</footer>

<script>
  let cart = 0;

  function login() {
    Pi.authenticate(['username'], function(auth) {
      alert("Murakaza neza " + auth.user.username);
    }, function(error) {
      alert("Habaye ikibazo co kwinjira");
      console.log(error);
    });
  }

  function buy(product, price) {
    cart++;
    document.getElementById("cartCount").innerText = cart;
    alert(
      "Wahisemwo kugura:\n" +
      product +
      "\nIgiciro: " + price + " Pi\n\n(Sandbox test)"
    );
  }
</script>

</body>
</html>
