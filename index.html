<!DOCTYPE html>
<html lang="rn">
<head>
  <meta charset="UTF-8">
  <title>nduwimana23 Pi Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    Pi.init({ version: "2.0", sandbox: true });
  </script>

  <style>
    body { font-family: Arial; background: #f5f5f5; margin:0; padding:10px; }
    h1 { text-align: center; color:#6a0dad; }
    .product { background:white; margin:10px 0; padding:10px; border-radius:8px; display:flex; align-items:center; }
    .product img { width:80px; height:80px; object-fit:cover; margin-right:10px; border-radius:5px; }
    .product-details { flex:1; }
    button { background:#6a0dad; color:white; border:none; padding:8px 12px; border-radius:5px; margin-top:5px; }
    .language-buttons { text-align:center; margin-bottom:10px; }
    .language-buttons button { margin:0 5px; background:#333; color:white; }
  </style>
</head>

<body>
<h1>🛒 nduwimana23 Pi Shop</h1>

<button onclick="login()">🔐 Injira muri Pi</button>

<div class="language-buttons">
  <button onclick="renderShop('kr')">🇧🇮 Kirundi</button>
  <button onclick="renderShop('pt')">🇲🇿 Portuguese</button>
</div>

<hr>

<div id="shop-container"></div>

<script>
  // Products array
  const products = [
    {name:{kr:"Amavuta ya Palme", pt:"Óleo de Palme"}, price:1, image:"images/amavuta-palme.jpg"},
    {name:{kr:"Amavuta ya Olive", pt:"Óleo de Oliva"}, price:2, image:"images/amavuta-olive.jpg"},
    {name:{kr:"Umuceri", pt:"Arroz"}, price:2, image:"images/umuceri.jpg"},
    {name:{kr:"Isukari", pt:"Açúcar"}, price:1, image:"images/isukari.jpg"},
    {name:{kr:"Ibiharage", pt:"Feijão"}, price:1, image:"images/ibiharage.jpg"},
    {name:{kr:"Isabuni", pt:"Sabão"}, price:1, image:"images/isabuni.jpg"},
    {name:{kr:"Ama jus", pt:"Suco"}, price:1, image:"images/jus.jpg"},
    {name:{kr:"Amata", pt:"Leite"}, price:1, image:"images/amata.jpg"},
    {name:{kr:"Pampers", pt:"Fralda"}, price:3, image:"images/pampers.jpg"},
    {name:{kr:"Fanta", pt:"Fanta"}, price:1, image:"images/fanta.jpg"},
    {name:{kr:"Imivinyu", pt:"Vinho"}, price:2, image:"images/vin.jpg"}
  ];

  // Render products
  function renderShop(lang="kr"){
    const container = document.getElementById('shop-container');
    container.innerHTML = "";
    products.forEach(product => {
      const div = document.createElement('div');
      div.className = "product";
      div.innerHTML = `
        <img src="${product.image}" alt="${product.name[lang]}">
        <div class="product-details">
          <h3>${product.name[lang]}</h3>
          <p>Igiciro: ${product.price} Pi</p>
          <button onclick="pay('${product.name[lang]}', ${product.price})">Gura na Pi</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  // Login function
  function login(){
    if(!window.Pi){ alert("Banza ukoreshe Pi Browser!"); return; }
    Pi.authenticate(['username'], function(auth){
      alert("Murakaza neza " + auth.user.username);
    }, function(error){
      alert("Habaye ikibazo co kwinjira");
    });
  }

  // Payment function
  function pay(item, amount){
    if(!window.Pi){ alert("Banza ukoreshe Pi Browser!"); return; }
    Pi.createPayment({
      amount: amount,
      memo: item,
      metadata: { product: item }
    },{
      onReadyForServerApproval: function(paymentId){ console.log(paymentId); },
      onReadyForServerCompletion: function(paymentId, txid){ alert("Waguze " + item + " neza!"); },
      onCancel: function(){ alert("Wahagaritse igikorwa"); },
      onError: function(error){ console.error(error); }
    });
  }

  // Initial render
  renderShop('kr');
</script>

</body>
</html>
