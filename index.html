<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pi Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    Pi.init({ version: "2.0", sandbox: true });
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding-bottom: 80px;
    }

    header {
      background: green;
      color: white;
      padding: 15px;
      text-align: center;
    }

    button {
      cursor: pointer;
    }

    .login-btn {
      background: white;
      color: green;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 10px;
    }

    .search-box {
      padding: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .categories {
      display: flex;
      gap: 10px;
      padding: 10px;
      overflow-x: auto;
    }

    .category {
      padding: 8px 14px;
      border-radius: 20px;
      background: #ddd;
      font-size: 13px;
    }

    .category.active {
      background: green;
      color: white;
    }

    .products {
      padding: 15px;
    }

    .product {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .product h3 {
      margin: 0 0 5px 0;
    }

    .price {
      color: green;
      font-weight: bold;
    }

    .buy-btn {
      background: green;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 8px;
      margin-top: 10px;
    }

    .ai-support {
      position: fixed;
      right: 15px;
      bottom: 90px;
      background: green;
      color: white;
      border-radius: 50%;
      width: 55px;
      height: 55px;
      font-size: 24px;
      border: none;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: white;
      display: flex;
      justify-content: space-around;
      border-top: 1px solid #ddd;
      padding: 8px 0;
    }

    .bottom-nav button {
      background: none;
      border: none;
      font-size: 12px;
      color: #444;
    }

    .bottom-nav button.active {
      color: green;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <h2>🛒 Pi Shop</h2>
    <p>All payments in Pi (GCV)</p>
    <button class="login-btn" onclick="login()">Injira muri Pi</button>
  </header>

  <!-- SEARCH -->
  <div class="search-box">
    <input type="text" placeholder="Shaka igicuruzwa...">
  </div>

  <!-- CATEGORIES -->
  <div class="categories">
    <div class="category active">Foods</div>
    <div class="category">Drinks</div>
    <div class="category">Electronics</div>
    <div class="category">Household</div>
  </div>

  <!-- PRODUCTS -->
  <div class="products">

    <div class="product">
      <h3>Umuceri</h3>
      <p>Category: Foods</p>
      <p class="price">2 Pi</p>
      <button class="buy-btn" onclick="buy()">Gura na Pi</button>
    </div>

    <div class="product">
      <h3>Fanta</h3>
      <p>Category: Drinks</p>
      <p class="price">1 Pi</p>
      <button class="buy-btn" onclick="buy()">Gura na Pi</button>
    </div>

    <div class="product">
      <h3>Radio</h3>
      <p>Category: Electronics</p>
      <p class="price">5 Pi</p>
      <button class="buy-btn" onclick="buy()">Gura na Pi</button>
    </div>

  </div>

  <!-- AI SUPPORT -->
  <button class="ai-support" onclick="openAI()">💬</button>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="active">Products</button>
    <button>Vendors</button>
    <button>My Cart</button>
    <button>Support</button>
    <button>Profile</button>
  </div>

  <!-- JS -->
  <script>
    function login() {
      Pi.authenticate(
        ['username'],
        function(auth) {
          alert("Murakaza neza " + auth.user.username);
        },
        function(error) {
          alert("Habaye ikibazo");
        }
      );
    }

    function buy() {
      alert("Payment test (Sandbox mode)");
    }

    function openAI() {
      alert("AI Support izoza mu version ikurikira 🚀");
    }
  </script>

</body>
</html>
