<!DOCTYPE html>
<html lang="rn">
<head>
  <meta charset="UTF-8">
  <title>nduwimana23 Pi Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    Pi.init({ version: "2.0", sandbox: true });
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 10px;
    }
    h1 {
      text-align: center;
      color: #6a0dad;
    }
    .product {
      background: white;
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
    }
    .product h3 {
      margin: 0;
    }
    button {
      background: #6a0dad;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<h1>🛒 nduwimana23 Pi Shop</h1>

<button onclick="login()">🔐 Injira muri Pi</button>

<hr>

<div id="shop-container"></div>

<script>
  // ---------------------------
  // 1️⃣ PRODUCTS ARRAY (Dynamic)
  // ---------------------------
  const products = [
    {name: "Amavuta ya Palme", price: 1, category:"Amavuta"},
    {name: "Amavuta ya Tournesol", price: 1, category:"Amavuta"},
    {name: "Amavuta ya Olive", price: 2, category:"Amavuta"},
    {name: "Umuceri wa Local", price: 2, category:"Umuceri"},
    {name: "Umuceri wa Pakistan", price: 3, category:"Umuceri"},
    {name: "Isukari yera", price: 1, category:"Isukari"},
    {name: "Isukari y’umukara", price: 1, category:"Isukari"},
    {name: "Ibiharage bitukura", price: 1, category:"Ibiharage"},
    {name: "Ibiharage vy’umukara", price: 1, category:"Ibiharage"},
    {name: "Ibiharage vy’umweru", price: 2, category:"Ibiharage"},
    {name: "Spaghetti Golden", price: 1, category:"Isubageti"},
    {name: "Spaghetti Royal", price: 1, category:"Isubageti"},
    {name: "Umunyu w’icayi", price: 1, category:"Umunyu"},
    {name: "Umunyu wo mu gikoni", price: 1, category:"Umunyu"},
    {name: "Isabuni OMO", price: 1, category:"Isabuni"},
    {name: "Isabuni Sunlight", price: 1, category:"Isabuni"},
    {name: "Isabuni Geisha", price: 1, category:"Isabuni"},
    {name: "Isabuni Dettol", price: 1, category:"Isabuni"},
    {name: "Jus ya Mango", price: 1, category:"Ama jus"},
    {name: "Jus ya Orange", price: 1, category:"Ama jus"},
    {name: "Jus ya Ananas", price: 1, category:"Ama jus"},
    {name: "Jus Cocktail", price: 1, category:"Ama jus"},
    {name: "Amata Inyange", price: 1, category:"Amata"},
    {name: "Amata Laiterie", price: 1, category:"Amata"},
    {name: "Amata Nido", price: 1, category:"Amata"},
    {name: "Pampers Small", price: 3, category:"Pampers"},
    {name: "Pampers Medium", price: 3, category:"Pampers"},
    {name: "Pampers Large", price: 4, category:"Pampers"},
    {name: "Fanta Orange", price: 1, category:"Fanta"},
    {name: "Fanta Citron", price: 1, category:"Fanta"},
    {name: "Coca Cola", price: 1, category:"Fanta"},
    {name: "Pepsi", price: 1, category:"Fanta"},
    {name: "Vin Rouge", price: 2, category:"Imivinyu"},
    {name: "Vin Blanc", price: 2, category:"Imivinyu"},
    {name: "Vin Rosé", price: 2, category:"Imivinyu"}
  ];

  // ---------------------------
  // 2️⃣ DISPLAY PRODUCTS
  // ---------------------------
  const container = document.getElementById('shop-container');

  products.forEach(product => {
    const div = document.createElement('div');
    div.className = "product";
    div.innerHTML = `
      <h3>${product.name}</h3>
      <p>Igiciro: ${product.price} Pi</p>
      <button onclick="pay('${product.name}', ${product.price})">Gura na Pi</button>
    `;
    container.appendChild(div);
  });

  // ---------------------------
  // 3️⃣ LOGIN FUNCTION
  // ---------------------------
  function login() {
    Pi.authenticate(['username'], function(auth) {
      alert("Murakaza neza " + auth.user.username);
    }, function(error) {
      alert("Habaye ikibazo co kwinjira");
    });
  }

  // ---------------------------
  // 4️⃣ PAYMENT FUNCTION
  // ---------------------------
  function pay(item, amount) {
    Pi.createPayment({
      amount: amount,
      memo: item,
      metadata: { product: item }
    }, {
      onReadyForServerApproval: function(paymentId) {
        console.log(paymentId);
      },
      onReadyForServerCompletion: function(paymentId, txid) {
        alert("Waguze " + item + " neza!");
      },
      onCancel: function() {
        alert("Wahagaritse igikorwa");
      },
      onError: function(error) {
        console.error(error);
      }
    });
  }

</script>

</body>
</html>
